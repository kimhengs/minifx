name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FFMPEG_VERSION: "7.1.1"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install Tauri Linux deps + ffmpeg (for Rust tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Rust tests (includes a real FFmpeg export of 60 frames)
        run: |
          mkdir -p dist src-tauri/binaries
          cp "$(which ffmpeg)"  src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          cp "$(which ffprobe)" src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
          cd src-tauri && cargo test --locked || cargo test
      - name: UI smoke test (Playwright, browser build)
        run: |
          npx playwright install --with-deps chromium
          npm run build
          npx playwright test
      - name: Desktop self-test (real app → WebGL render → FFmpeg export, headless)
        run: |
          sudo apt-get install -y xvfb
          cd src-tauri && cargo build --features tauri/custom-protocol
          MINIFX_SELFTEST_OUT=/tmp/selftest.mp4 timeout 180 xvfb-run -a -s "-screen 0 1600x1000x24" ./target/debug/minifx || true
          grep "SELFTEST done" ~/.local/share/com.minifx.app/logs/minifx.log
          ffprobe -v error -count_packets -select_streams v:0 -show_entries stream=nb_read_packets -of csv=p=0 /tmp/selftest.mp4

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      - run: npm ci

      - name: Fetch pinned FFmpeg sidecars
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip"
          Invoke-WebRequest $url -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe  | Select-Object -First 1).FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe
          & src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -hide_banner -version | Select-Object -First 1

      - name: Optional code signing + updater config
        id: cfg
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          $cfg = @{}
          if ($env:WINDOWS_CERTIFICATE) {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            [IO.File]::WriteAllBytes("cert.pfx", $bytes)
            $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
            Remove-Item cert.pfx
            $cfg.bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } }
            Write-Host "Code signing enabled"
          }
          if ($env:TAURI_SIGNING_PRIVATE_KEY -and $env:TAURI_UPDATER_PUBKEY) {
            if (-not $cfg.bundle) { $cfg.bundle = @{} }
            $cfg.bundle.createUpdaterArtifacts = $true
            $repo = "${{ github.repository }}"
            $cfg.plugins = @{ updater = @{ pubkey = $env:TAURI_UPDATER_PUBKEY; endpoints = @("https://github.com/$repo/releases/latest/download/latest.json") } }
            Write-Host "Updater artifacts enabled"
          }
          $json = ($cfg | ConvertTo-Json -Depth 10 -Compress)
          if ($cfg.Count -gt 0) { Set-Content -Path ci.tauri.conf.json -Value $json; "args=--config ci.tauri.conf.json" >> $env:GITHUB_OUTPUT } else { "args=" >> $env:GITHUB_OUTPUT }

      - name: Build installers (NSIS .exe + MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ steps.cfg.outputs.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: MiniFX ${{ github.ref_name }}
          releaseBody: "Download **MiniFX_*_x64-setup.exe** below, run it (no admin needed). See BUILD.md for notes."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiniFX-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
